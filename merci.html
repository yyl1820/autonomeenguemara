<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merci — Autonome en Guemara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style-base.css" />
  <style>
    :root {
      --fond:            #faf7f2;
      --fond-alt:        #f0ebe3;
      --texte:           #1a1a2e;
      --texte-doux:      #4a4a6a;
      --texte-leger:     #7a7490;
      --accent:          #c9a84c;
      --accent-clair:    #dbb95e;
      --accent-alpha:    rgba(201,168,76,0.15);
      --accent2:         #2c4a7c;
      --accent2-clair:   #3a5f9e;
      --accent2-alpha:   rgba(44,74,124,0.08);
      --separateur:      #ddd5c8;
      --card-fond:       #ffffff;
      --card-ombre:      rgba(26,26,46,0.07);
      --card-ombre-hover:rgba(26,26,46,0.13);
      --footer-fond:     #1a1a2e;
      --footer-texte:    rgba(240,230,208,0.5);
      --footer-lien:     rgba(201,168,76,0.6);
      --btn-accent-texte:#ffffff;
      --ff-titre: 'Playfair Display', Georgia, serif;
      --ff-corps: 'Inter', system-ui, sans-serif;
    }

    .merci-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }

    .merci-bloc {
      max-width: 560px;
    }

    .merci-bloc__icone {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      display: block;
    }

    .merci-bloc h1 {
      font-family: var(--ff-titre);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      color: var(--texte);
      margin-bottom: 1.2rem;
      line-height: 1.3;
    }

    .merci-bloc p {
      font-family: var(--ff-corps);
      font-size: 1.1rem;
      color: var(--texte-doux);
      line-height: 1.75;
      margin-bottom: 2rem;
    }

    .merci-bloc__signature {
      font-family: var(--ff-titre);
      font-style: italic;
      color: var(--accent);
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
      display: block;
    }
  </style>
</head>
<body>

  <section class="merci-section">
    <div class="merci-bloc">
      <span class="merci-bloc__icone">✉️</span>
      <h1>Merci !</h1>
      <p>Votre demande a bien été reçue.<br>Je vous réponds dans les 24 heures.</p>
      <span class="merci-bloc__signature">— Yoël Yaacov Laguerre</span>
      <a href="index.html" class="btn btn--accent">Retourner à l'accueil</a>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>© 2026 Yoel Yaacov Laguerre — Tous droits réservés</p>
    </div>
  </footer>

</body>
</html>
