<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validation AEG — Brouillons en attente</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --fond:        #faf7f2;
      --fond-alt:    #f0ebe3;
      --texte:       #1a1a2e;
      --texte-doux:  #4a4a6a;
      --texte-leger: #7a7490;
      --or:          #c9a84c;
      --or-clair:    #dbb95e;
      --bleu:        #2c4a7c;
      --bleu-clair:  #3a5f9e;
      --separateur:  #ddd5c8;
      --card-fond:   #ffffff;
      --card-ombre:  rgba(26,26,46,0.07);
      --vert:        #2e7d32;
      --vert-clair:  #388e3c;
      --rouge:       #b71c1c;
      --rouge-clair: #c62828;

      --ff-titre: 'Playfair Display', Georgia, serif;
      --ff-corps: 'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--fond);
      color: var(--texte);
      font-family: var(--ff-corps);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--bleu);
      color: #fff;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header__titre {
      font-family: var(--ff-titre);
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .header__sous {
      font-size: 0.8rem;
      opacity: 0.75;
      font-style: italic;
    }
    .header__badge {
      background: var(--or);
      color: var(--bleu);
      font-weight: 600;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* ── Auth screen ── */
    .auth-screen {
      max-width: 420px;
      margin: 80px auto;
      padding: 0 24px;
      text-align: center;
    }
    .auth-screen h2 {
      font-family: var(--ff-titre);
      font-size: 1.6rem;
      color: var(--bleu);
      margin-bottom: 8px;
    }
    .auth-screen p {
      color: var(--texte-doux);
      margin-bottom: 28px;
      font-size: 0.9rem;
    }
    .auth-card {
      background: var(--card-fond);
      border-radius: 14px;
      box-shadow: 0 4px 20px var(--card-ombre);
      padding: 32px 28px;
    }
    .auth-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--texte-doux);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      text-align: left;
    }
    .auth-card input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--separateur);
      border-radius: 8px;
      font-family: var(--ff-corps);
      font-size: 1rem;
      background: var(--fond);
      color: var(--texte);
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    .auth-card input:focus { border-color: var(--bleu); }
    .auth-card input[type="password"] { letter-spacing: 0.1em; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 22px;
      border-radius: 8px;
      font-family: var(--ff-corps);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s, transform 0.1s, opacity 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: default; }

    .btn--bleu  { background: var(--bleu);  color: #fff; width: 100%; }
    .btn--bleu:hover { background: var(--bleu-clair); }

    .btn--vert  { background: var(--vert);  color: #fff; }
    .btn--vert:hover { background: var(--vert-clair); }

    .btn--rouge { background: var(--rouge); color: #fff; }
    .btn--rouge:hover { background: var(--rouge-clair); }

    .btn--or    { background: var(--or);    color: var(--bleu); }
    .btn--or:hover { background: var(--or-clair); }

    .btn--ghost {
      background: transparent;
      border: 1.5px solid var(--separateur);
      color: var(--texte-doux);
    }
    .btn--ghost:hover { border-color: var(--bleu); color: var(--bleu); }

    /* ── Main ── */
    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }
    .toolbar__titre {
      font-family: var(--ff-titre);
      font-size: 1.4rem;
      color: var(--bleu);
    }
    .toolbar__titre span {
      color: var(--or);
      font-style: italic;
    }

    /* ── État vide / chargement ── */
    .etat {
      text-align: center;
      padding: 60px 24px;
      color: var(--texte-doux);
    }
    .etat__icone { font-size: 2.5rem; margin-bottom: 12px; }
    .etat__titre { font-family: var(--ff-titre); font-size: 1.2rem; color: var(--texte); margin-bottom: 8px; }
    .etat__texte { font-size: 0.9rem; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--separateur);
      border-top-color: var(--bleu);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    .toast-wrap {
      position: fixed;
      bottom: 24px;
      right: 24px;
      left: 24px;
      max-width: 400px;
      margin: 0 auto;
      z-index: 1000;
      pointer-events: none;
    }
    .toast {
      background: var(--texte);
      color: #fff;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: auto;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok   { background: var(--vert); }
    .toast.err  { background: var(--rouge); }

    /* ── Card ── */
    .card {
      background: var(--card-fond);
      border-radius: 14px;
      box-shadow: 0 3px 16px var(--card-ombre);
      margin-bottom: 20px;
      overflow: hidden;
      border-left: 4px solid var(--or);
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 6px 24px rgba(26,26,46,0.12); }
    .card.resolving { opacity: 0.55; pointer-events: none; }

    .card__head {
      padding: 20px 24px 16px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card__nom {
      font-family: var(--ff-titre);
      font-size: 1.2rem;
      color: var(--bleu);
      font-weight: 600;
    }
    .card__badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }
    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge--canal   { background: #e8eef7; color: var(--bleu); }
    .badge--profil  { background: #fef3e2; color: #7a4800; }
    .badge--niveau  { background: #f0ebe3; color: #5a4828; }

    .card__meta {
      padding: 0 24px 14px;
      font-size: 0.82rem;
      color: var(--texte-leger);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    .card__message-label {
      padding: 0 24px 8px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--texte-leger);
    }
    .card__message {
      margin: 0 24px 16px;
      padding: 16px 18px;
      background: var(--fond);
      border-radius: 8px;
      border: 1px solid var(--separateur);
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--texte);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .card__actions {
      padding: 0 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card__actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .card__reject-zone {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #fff5f5;
      border: 1px solid #ffd0d0;
      border-radius: 8px;
      padding: 14px;
    }
    .card__reject-zone.open { display: flex; }
    .card__reject-zone label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--rouge);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .card__reject-zone textarea {
      width: 100%;
      min-height: 80px;
      padding: 10px 12px;
      border: 1.5px solid #ffd0d0;
      border-radius: 6px;
      font-family: var(--ff-corps);
      font-size: 0.9rem;
      resize: vertical;
      outline: none;
      background: #fff;
      color: var(--texte);
    }
    .card__reject-zone textarea:focus { border-color: var(--rouge); }
    .card__reject-row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* ── Section "déjà traités" ── */
    .divider {
      border: none;
      border-top: 1px solid var(--separateur);
      margin: 36px 0 28px;
    }

    /* ── Responsive ── */
    @media (max-width: 540px) {
      .main { padding: 20px 16px 60px; }
      .card__head { padding: 16px 18px 12px; }
      .card__message { margin: 0 18px 14px; }
      .card__actions { padding: 0 18px 18px; }
      .card__actions-row { flex-direction: column; }
      .card__actions-row .btn { width: 100%; }
      .btn--vert, .btn--rouge { width: 100%; }
    }
  </style>
</head>
<body>

<!-- ══ En-tête ══════════════════════════════════════════ -->
<header class="header">
  <div>
    <div class="header__titre">Autonome en Guemara</div>
    <div class="header__sous">Interface de validation des brouillons</div>
  </div>
  <div id="headerBadge" style="display:none" class="header__badge">— en attente</div>
</header>

<!-- ══ Auth screen ═══════════════════════════════════════ -->
<div id="authScreen" class="auth-screen">
  <h2>Accès sécurisé</h2>
  <p>Entrez le secret AEG pour accéder aux brouillons en attente de validation.</p>
  <div class="auth-card">
    <label for="secretInput">Clé secrète AEG</label>
    <input type="password" id="secretInput" placeholder="••••••••••••••••••••••••" autocomplete="current-password" />
    <label for="serverInput">URL du serveur</label>
    <input type="url" id="serverInput" value="https://turbogrowth.onrender.com" />
    <button class="btn btn--bleu" id="authBtn" onclick="seConnecter()">Se connecter</button>
  </div>
</div>

<!-- ══ Tableau de bord ════════════════════════════════════ -->
<main id="dashboard" class="main" style="display:none">
  <div class="toolbar">
    <div class="toolbar__titre" id="toolbarTitre">Brouillons <span>en attente</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn--or" onclick="charger()">↻ Rafraîchir</button>
      <button class="btn btn--ghost" onclick="seDeconnecter()">Déconnexion</button>
    </div>
  </div>

  <div id="zoneChargement" class="etat">
    <div class="spinner"></div>
    <div class="etat__texte">Chargement des brouillons…</div>
  </div>

  <div id="zoneVide" class="etat" style="display:none">
    <div class="etat__icone">✓</div>
    <div class="etat__titre">Aucun brouillon en attente</div>
    <div class="etat__texte">Tous les prospects sont à jour.</div>
  </div>

  <div id="listeCards"></div>
</main>

<!-- ══ Toast ══════════════════════════════════════════════ -->
<div class="toast-wrap">
  <div id="toast" class="toast"></div>
</div>

<script>
  const BASE_URL_DEFAULT = 'https://turbogrowth.onrender.com'

  let SECRET = ''
  let SERVER = BASE_URL_DEFAULT
  let toastTimer = null

  // ── Persistance ────────────────────────────────────────
  function chargerConfig() {
    try {
      SECRET = localStorage.getItem('aeg_secret') || ''
      SERVER = localStorage.getItem('aeg_server') || BASE_URL_DEFAULT
      if (SECRET) {
        document.getElementById('secretInput').value = SECRET
        document.getElementById('serverInput').value = SERVER
      }
    } catch(e) {}
  }

  function sauvegarderConfig() {
    try {
      localStorage.setItem('aeg_secret', SECRET)
      localStorage.setItem('aeg_server', SERVER)
    } catch(e) {}
  }

  function seConnecter() {
    const s = document.getElementById('secretInput').value.trim()
    const srv = document.getElementById('serverInput').value.trim()
    if (!s) { afficherToast('Entrez la clé secrète', 'err'); return }
    SECRET = s
    SERVER = srv || BASE_URL_DEFAULT
    sauvegarderConfig()
    document.getElementById('authScreen').style.display = 'none'
    document.getElementById('dashboard').style.display = 'block'
    charger()
  }

  function seDeconnecter() {
    SECRET = ''
    try { localStorage.removeItem('aeg_secret') } catch(e) {}
    document.getElementById('authScreen').style.display = 'block'
    document.getElementById('dashboard').style.display = 'none'
    document.getElementById('secretInput').value = ''
  }

  // ── Toast ───────────────────────────────────────────────
  function afficherToast(msg, type = '') {
    const t = document.getElementById('toast')
    t.textContent = msg
    t.className = 'toast show' + (type ? ' ' + type : '')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => { t.classList.remove('show') }, 3500)
  }

  // ── API ─────────────────────────────────────────────────
  async function api(method, path, body) {
    const opts = {
      method,
      headers: { 'x-aeg-secret': SECRET, 'Content-Type': 'application/json' }
    }
    if (body) opts.body = JSON.stringify(body)
    const r = await fetch(SERVER + path, opts)
    if (!r.ok) {
      const txt = await r.text().catch(() => '')
      throw new Error(r.status + (txt ? ' — ' + txt.slice(0, 120) : ''))
    }
    return r.json()
  }

  // ── Chargement ───────────────────────────────────────────
  async function charger() {
    const zoneChargement = document.getElementById('zoneChargement')
    const zoneVide       = document.getElementById('zoneVide')
    const liste          = document.getElementById('listeCards')
    const badge          = document.getElementById('headerBadge')

    zoneChargement.style.display = 'block'
    zoneVide.style.display       = 'none'
    liste.innerHTML              = ''

    try {
      const data = await api('GET', '/api/aeg/prospects')
      const enAttente = (data.prospects || []).filter(p => p.brouillon_statut === 'en_attente')
      const total = data.count || 0

      badge.textContent = enAttente.length + ' en attente'
      badge.style.display = enAttente.length ? 'block' : 'none'

      const titre = document.getElementById('toolbarTitre')
      titre.innerHTML = enAttente.length
        ? `Brouillons <span>en attente</span> (${enAttente.length})`
        : `Brouillons <span>en attente</span>`

      zoneChargement.style.display = 'none'

      if (!enAttente.length) {
        zoneVide.style.display = 'block'
        return
      }

      enAttente.forEach(p => liste.appendChild(creerCard(p)))

    } catch(err) {
      zoneChargement.style.display = 'none'
      afficherToast('Erreur : ' + err.message, 'err')

      // Si 401 → retour login
      if (err.message.startsWith('401')) {
        afficherToast('Secret invalide — reconnectez-vous', 'err')
        setTimeout(() => seDeconnecter(), 1800)
      }
    }
  }

  // ── Création d'une card ───────────────────────────────────
  function creerCard(p) {
    const card = document.createElement('div')
    card.className = 'card'
    card.id = 'card-' + p.id

    const profils = {
      DEBUTANT_COMPLET:   'Débutant complet',
      BLOQUE_VOCABULAIRE: 'Bloqué — vocabulaire',
      BLOQUE_LOGIQUE:     'Bloqué — logique',
      REVEUR_AUTONOMIE:   'Rêveur d\'autonomie',
      PROJET_FAMILIAL:    'Projet familial',
      MARRE_DES_GROUPES:  'Marre des groupes',
      INCONNU:            'Inconnu',
    }
    const canaux = {
      email: '✉ Email', linkedin: '💼 LinkedIn',
      facebook: '🔵 Facebook', instagram: '📸 Instagram'
    }

    const nomAffiche = [p.prenom, p.nom].filter(Boolean).join(' ') || p.email || ('Prospect #' + p.id)
    const profilLabel = profils[p.profil] || p.profil || '—'
    const canalLabel  = canaux[p.canal] || p.canal || '—'
    const niveauLabel = 'N' + (p.niveau ?? '?')

    const message = p.brouillon_message || '(aucun message enregistré)'

    const metaDate = p.created_at
      ? new Date(p.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'long', year: 'numeric' })
      : ''

    card.innerHTML = `
      <div class="card__head">
        <div class="card__nom">${esc(nomAffiche)}</div>
        <div class="card__badges">
          <span class="badge badge--canal">${esc(canalLabel)}</span>
          <span class="badge badge--profil">${esc(profilLabel)}</span>
          <span class="badge badge--niveau">${esc(niveauLabel)}</span>
        </div>
      </div>
      <div class="card__meta">
        ${p.email ? `<span>✉ ${esc(p.email)}</span>` : ''}
        ${p.linkedin_url ? `<span>🔗 LinkedIn</span>` : ''}
        ${metaDate ? `<span>🗓 ${esc(metaDate)}</span>` : ''}
        ${p.followup_count ? `<span>📨 Relance nº${p.followup_count}</span>` : ''}
      </div>
      <div class="card__message-label">Message généré</div>
      <div class="card__message">${esc(message)}</div>
      <div class="card__actions">
        <div class="card__actions-row">
          <button class="btn btn--vert" onclick="valider(${p.id})">✔ Valider &amp; envoyer</button>
          <button class="btn btn--rouge" onclick="toggleRejet(${p.id})">✘ Rejeter</button>
        </div>
        <div class="card__reject-zone" id="reject-${p.id}">
          <label for="alt-${p.id}">Message alternatif (optionnel)</label>
          <textarea id="alt-${p.id}" placeholder="Laissez vide pour rejeter sans envoyer, ou écrivez un message de remplacement…"></textarea>
          <div class="card__reject-row">
            <button class="btn btn--ghost" onclick="toggleRejet(${p.id})">Annuler</button>
            <button class="btn btn--rouge" onclick="rejeter(${p.id})">Confirmer le rejet</button>
          </div>
        </div>
      </div>
    `
    return card
  }

  function esc(s) {
    return String(s ?? '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;')
  }

  function toggleRejet(id) {
    const zone = document.getElementById('reject-' + id)
    zone.classList.toggle('open')
  }

  // ── Actions ───────────────────────────────────────────────
  async function valider(id) {
    const card = document.getElementById('card-' + id)
    if (!card) return
    card.classList.add('resolving')
    try {
      await api('POST', '/api/aeg/valider/' + id)
      afficherToast('✔ Message envoyé avec succès', 'ok')
      card.style.transition = 'opacity 0.4s, max-height 0.5s'
      card.style.opacity = '0'
      card.style.overflow = 'hidden'
      setTimeout(() => {
        card.style.maxHeight = '0'
        card.style.marginBottom = '0'
        setTimeout(() => card.remove(), 400)
      }, 300)
      mettreAJourCompteur(-1)
    } catch(err) {
      card.classList.remove('resolving')
      afficherToast('Erreur : ' + err.message, 'err')
    }
  }

  async function rejeter(id) {
    const card = document.getElementById('card-' + id)
    const alt  = (document.getElementById('alt-' + id)?.value || '').trim()
    if (!card) return
    card.classList.add('resolving')
    try {
      const body = alt ? { message: alt } : {}
      await api('POST', '/api/aeg/rejeter/' + id, body)
      const msg = alt ? '↩ Rejeté et message alternatif enregistré' : '✘ Brouillon rejeté'
      afficherToast(msg, 'ok')
      card.style.transition = 'opacity 0.4s'
      card.style.opacity = '0'
      setTimeout(() => {
        card.style.overflow = 'hidden'
        card.style.maxHeight = '0'
        card.style.marginBottom = '0'
        setTimeout(() => card.remove(), 400)
      }, 300)
      mettreAJourCompteur(-1)
    } catch(err) {
      card.classList.remove('resolving')
      afficherToast('Erreur : ' + err.message, 'err')
    }
  }

  function mettreAJourCompteur(delta) {
    const liste = document.getElementById('listeCards')
    const cards = liste.querySelectorAll('.card:not([style*="max-height: 0"])')
    const n = Math.max(0, cards.length - 1 + delta)

    const badge = document.getElementById('headerBadge')
    const titre = document.getElementById('toolbarTitre')

    setTimeout(() => {
      const remaining = liste.querySelectorAll('.card').length
      if (!remaining) {
        document.getElementById('zoneVide').style.display = 'block'
        badge.style.display = 'none'
        titre.innerHTML = `Brouillons <span>en attente</span>`
      } else {
        badge.textContent = remaining + ' en attente'
        titre.innerHTML = `Brouillons <span>en attente</span> (${remaining})`
      }
    }, 800)
  }

  // ── Démarrage ────────────────────────────────────────────
  chargerConfig()

  // Auto-connect si secret déjà stocké
  if (SECRET) {
    document.getElementById('authScreen').style.display = 'none'
    document.getElementById('dashboard').style.display = 'block'
    charger()
  }

  // Entrée clavier sur le champ secret
  document.getElementById('secretInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') seConnecter()
  })
</script>

</body>
</html>
